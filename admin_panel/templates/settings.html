{% extends 'base.html' %}{% block content %}<h1>Settings</h1><form method="post"><label>UPI ID</label><input class="form-control mb-2" name="upi_id" value="{{settings.get('upi_id','')}}"><label>Binance QR path or payment instructions</label><input class="form-control mb-2" name="binance_pay_qr_path" value="{{settings.get('binance_pay_qr_path','')}}"><label>Low stock threshold</label><input class="form-control mb-2" name="low_stock_threshold" value="{{settings.get('low_stock_threshold','3')}}"><label>Expiry timeout minutes</label><input class="form-control mb-2" name="order_expiry_minutes" value="{{settings.get('order_expiry_minutes','30')}}"><button class="btn btn-primary">Save</button></form>{% endblock %}
