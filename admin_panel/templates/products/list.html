{% extends 'base.html' %}{% block content %}<h1>Products</h1><form method="post" enctype="multipart/form-data" class="card card-body mb-3"><input class="form-control mb-2" name="name" placeholder="Name"><input class="form-control mb-2" name="price" placeholder="Price"><textarea class="form-control mb-2" name="description" placeholder="Description"></textarea><input class="form-control mb-2" type="file" name="image"><button class="btn btn-primary">Add product</button></form><table class="table"><tr><th>Name</th><th>Price</th><th>Active</th><th>Stock</th><th>Restock</th><th></th></tr>{% for p in products %}<tr><td>{{p.name}}</td><td>{{p.price}}</td><td>{{p.is_active}}</td><td>{{stock_count(request.app.dependency_overrides if false else products.__class__, p.id) if false else 'see bot/db'}}</td><td><form method="post" action="/products/{{p.id}}/stock"><textarea name="codes" class="form-control" placeholder="one code per line"></textarea><button class="btn btn-sm btn-success">Add</button></form></td><td><form method="post" action="/products/{{p.id}}/delete"><button class="btn btn-sm btn-danger">Disable</button></form></td></tr>{% endfor %}</table>{% endblock %}
