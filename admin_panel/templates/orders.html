{% extends 'base.html' %}{% block content %}<h1>Orders</h1><table class="table"><tr><th>No</th><th>Status</th><th>Amount</th><th>Code</th><th>Actions</th></tr>{% for o in orders %}<tr><td>{{o.order_number}}</td><td>{{o.status.value}}</td><td>{{o.payment_amount}}</td><td><code>{{o.delivered_code or ''}}</code></td><td><form class="d-inline" method="post" action="/orders/{{o.id}}/confirm"><button class="btn btn-sm btn-success">Confirm</button></form><form class="d-inline" method="post" action="/orders/{{o.id}}/reject"><button class="btn btn-sm btn-warning">Reject</button></form></td></tr>{% endfor %}</table>{% endblock %}
