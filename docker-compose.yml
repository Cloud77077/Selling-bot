services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: selling_bot
      POSTGRES_USER: selling_bot
      POSTGRES_PASSWORD: selling_bot
    volumes: [pgdata:/var/lib/postgresql/data]
  bot:
    build: .
    env_file: .env
    depends_on: [postgres]
    command: python -m bot.main
  admin_panel:
    build: .
    env_file: .env
    depends_on: [postgres]
    command: uvicorn admin_panel.main:app --host 0.0.0.0 --port 8000
  nginx:
    image: nginx:alpine
    ports: ['80:80','443:443']
    volumes: ['./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [admin_panel]
volumes: {pgdata: {}}
